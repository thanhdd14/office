<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title></title>
		<meta name="description" content="">
		<meta name="keywords" content="">
		<meta name="format-detection" content="telephone=no">
		<!--	<link rel="shortcut icon" href="./favicon.ico" >-->
		<link type="text/css" rel="stylesheet" href="./css/iconsax.css">
		<link type="text/css" rel="stylesheet" href="./css/styles.css">
	</head>
	<body>
		<div class="login">
			<div class="login-wrap">
				<div class="login-wrap__left">
					<div class="login-wrap__logo">
						<img src="./img/logo.svg" alt="Office">
					</div>
					<div class="login-wrap__note">
						<h1 class="login-wrap__ttl"> Không chỉ là một GIẢI <span>PHÁP QUẢN LÝ</span>
						</h1>
						<p> Làm việc mọi lúc mọi nơi </p>
					</div>
					<div class="login-wrap__img">
						<img src="./img/bg1.svg" alt="Office">
					</div>
				</div>
				<div class="login-wrap__right">
					<div class="login-form">
						<div class="login-form__heading">
							<h2 class="login-form__heading-ttl">Đăng nhập</h2>
							<div class="login-form__heading-language">
								<span class="login-form__heading-option">
									<img src="./img/vn.svg" alt="vn"> Tiếng Việt </span>
								<ul>
									<li>
										<a href="">
											<img src="./img/vn.svg" alt="vn"> Tiếng Việt </a>
									</li>
									<li>
										<a href="">
											<img src="./img/gb.svg" alt="English"> English </a>
									</li>
									<li>
										<a href="">
											<img src="./img/cn.svg" alt="中文简体"> 中文简体 </a>
									</li>
									<li>
										<a href="">
											<img src="./img/jp.svg" alt="日本語"> 日本語 </a>
									</li>
									<li>
										<a href="">
											<img src="./img/ru.svg" alt="Русский"> Русский </a>
									</li>
								</ul>
							</div>
						</div>
						<div class="login-form__show">
							<div class="login-form__show-item">
								<label class="login-form__show-ttl">Tên đăng nhập*</label>
								<input type="text" class="form-control">
								<span class="login-form__show-icon">
									<img src="./img/user.svg" alt="user">
								</span>
							</div>
							<div class="login-form__show-item">
								<label class="login-form__show-ttl">Mật khẩu*</label>
								<input type="password" class="form-control">
								<span class="login-form__show-icon"><img src="./img/pass.svg" alt="user"></span>
								<span class="login-form__show-eye">
									<img src="./img/eye.svg" alt="eye">
								</span>
							</div>
						</div>
						<div class="login-form__check">
							<div class="pure-list__input">
								<input name="checkbox" type="checkbox" checked="checked">
								<span>Giữ tôi luôn đăng nhập</span>
							</div>
							<a href="" target="_blank">Quên mật khẩu?</a>
						</div>
						<div class="login-form__sub">
							<button type="button" class="c-btn__01">Đăng Nhập</button>
						</div>
						<div class="login-form__note">
							<p> Cài đặt ứng dụng trên điện thoại </p>
							<div class="login-form__note-app">
								<a href="" target="_blank">
									<img src="./img/chplay.svg" alt="chplay">
								</a>
								<a href="" target="_blank">
									<img src="./img/appstore.svg" alt="appstore">
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
		<script src="./js/setting.js"></script>
	</body>
</html>
